name: update-feed
on:
  schedule:
    - cron: '0 0 * * *'   # 09:00 JST (DFOマネージャーの定期実行11:05より前)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch gfeed.xml
        run: curl -fsSL --retry 3 --retry-delay 10 https://kamehouse-db.com/gfeed.xml -o gfeed.xml
      - name: Convert to DFOM CSV
        run: python3 gfeed_to_dfom.py gfeed.xml kamehouse_products_instock.csv
      - name: Commit & push if changed
        run: |
          git config user.name "kamehouse-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kamehouse_products_instock.csv
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update feed $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            git push
          fi
